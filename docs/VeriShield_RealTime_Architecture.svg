<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <rect width="1600" height="960" fill="#10161d"/>
  <style>
    .title{font:700 42px Arial,sans-serif;fill:#f4f7f8}.sub{font:400 18px Arial,sans-serif;fill:#9eabb4}.label{font:700 18px Arial,sans-serif;fill:#f4f7f8}.body{font:400 15px Arial,sans-serif;fill:#c3cdd2}.tiny{font:700 12px Arial,sans-serif;letter-spacing:2px;fill:#72d5bd}.box{fill:#18222a;stroke:#3a4b56;stroke-width:2}.accent{fill:#153b3d;stroke:#50d0b1;stroke-width:2}.warn{fill:#3b2d1b;stroke:#e5b45e;stroke-width:2}.line{stroke:#69cdb4;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69cdb4"/></marker></defs>
  <text x="80" y="78" class="title">VeriShield AI</text>
  <text x="80" y="112" class="sub">Real-time identity verification and fraud intelligence platform</text>
  <text x="80" y="162" class="tiny">ONE PERSON  /  MULTIPLE SIGNALS  /  EXPLAINABLE DECISION</text>

  <rect x="80" y="210" width="1440" height="110" rx="4" class="accent"/>
  <text x="800" y="254" text-anchor="middle" class="label">CAPTURE AND EXTRACT</text>
  <text x="800" y="286" text-anchor="middle" class="body">Document image, optional selfie, OCR fields, document classification</text>
  <path d="M800 320 V365" class="line"/>

  <rect x="80" y="365" width="260" height="180" rx="4" class="box"/>
  <text x="210" y="405" text-anchor="middle" class="label">DOCUMENT</text>
  <text x="105" y="443" class="body">Structure and checksum</text><text x="105" y="470" class="body">MRZ / Verhoeff / DL rules</text><text x="105" y="497" class="body">OCR confidence</text>
  <rect x="390" y="365" width="260" height="180" rx="4" class="box"/>
  <text x="520" y="405" text-anchor="middle" class="label">INTEGRITY</text>
  <text x="415" y="443" class="body">ELA / recompression</text><text x="415" y="470" class="body">Advisory heuristic</text><text x="415" y="497" class="body">Not authentication</text>
  <rect x="700" y="365" width="260" height="180" rx="4" class="box"/>
  <text x="830" y="405" text-anchor="middle" class="label">PERSON</text>
  <text x="725" y="443" class="body">Optional face capture</text><text x="725" y="470" class="body">Advisory similarity</text><text x="725" y="497" class="body">Officer-reviewed</text>
  <rect x="1010" y="365" width="510" height="180" rx="4" class="warn"/>
  <text x="1265" y="405" text-anchor="middle" class="label">AUTHORITY GATEWAY</text>
  <text x="1035" y="443" class="body">Provider adapter boundary</text><text x="1035" y="470" class="body">Current status: integration ready</text><text x="1035" y="497" class="body">No government provider connected</text>
  <path d="M210 545 V595 H800" class="line"/><path d="M520 545 V595 H800" class="line"/><path d="M830 545 V595 H800" class="line"/><path d="M1265 545 V595 H800" class="line"/>

  <rect x="520" y="595" width="560" height="120" rx="4" class="accent"/>
  <text x="800" y="638" text-anchor="middle" class="label">CROSS-CONSISTENCY AND RISK</text>
  <text x="800" y="672" text-anchor="middle" class="body">Rule-based signals plus advisory risk aggregation</text>
  <path d="M800 715 V760" class="line"/>
  <rect x="360" y="760" width="360" height="105" rx="4" class="box"/><text x="540" y="802" text-anchor="middle" class="label">DECISION SUPPORT</text><text x="540" y="832" text-anchor="middle" class="body">Clear / review / escalate</text>
  <rect x="840" y="760" width="400" height="105" rx="4" class="box"/><text x="1040" y="802" text-anchor="middle" class="label">CASE AND AUDIT</text><text x="1040" y="832" text-anchor="middle" class="body">Officer decision, receipt, audit chain</text>
  <path d="M800 715 V742 H540 V760" class="line"/><path d="M800 715 V742 H1040 V760" class="line"/>
  <text x="80" y="920" class="tiny">SUPPORTING TRUST: ECDSA DEVICE IDENTITY  |  RBAC ADMIN GATE  |  SQLITE LEDGER  |  SHA-256 AUDIT CHAIN</text>
</svg>
