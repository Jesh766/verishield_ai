<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VeriShield AI real-time identity verification architecture</title>
  <desc id="desc">Capture and extract document and person inputs, aggregate document, person, authority and device signals, assess consistency and advisory risk, produce an explainable decision, create a case record, and preserve a tamper-evident audit chain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08151b"/><stop offset="1" stop-color="#10252a"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#143e40"/><stop offset="1" stop-color="#1c3038"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 z" fill="#6fe0c1"/></marker>
    <style>
      .title{font:700 46px Arial,sans-serif;letter-spacing:1px;fill:#f5fbfa}.subtitle{font:400 21px Arial,sans-serif;fill:#aac2c5}.eyebrow{font:700 13px Arial,sans-serif;letter-spacing:3px;fill:#77e1c3}.section{font:700 16px Arial,sans-serif;letter-spacing:2px;fill:#77e1c3}.head{font:700 19px Arial,sans-serif;fill:#f5fbfa}.copy{font:400 14px Arial,sans-serif;fill:#bdd0d2}.small{font:700 12px Arial,sans-serif;letter-spacing:1px;fill:#8da9ad}.flow{stroke:#6fe0c1;stroke-width:3;fill:none;marker-end:url(#arrow)}.rail{stroke:#477980;stroke-width:2;fill:none}.signal{fill:url(#signal);stroke:#4e8587;stroke-width:2}.main{fill:#123d3d;stroke:#6fe0c1;stroke-width:2}.authority{fill:#3e321e;stroke:#e4b967;stroke-width:2}.audit{fill:#172d38;stroke:#7aa5bb;stroke-width:2}.node{fill:#14272d;stroke:#42666d;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 154 H1600" stroke="#27464d"/>
  <text x="72" y="74" class="eyebrow">VERIFICATION PLATFORM / SIH PRESENTATION ARCHITECTURE</text>
  <text x="72" y="125" class="title">VERISHIELD AI</text>
  <text x="72" y="157" class="subtitle">REAL-TIME IDENTITY VERIFICATION &amp; FRAUD INTELLIGENCE</text>
  <text x="1330" y="83" text-anchor="end" class="small">MULTI-SIGNAL TRUST</text>
  <text x="1330" y="108" text-anchor="end" class="copy">One case. Independent evidence.</text>

  <text x="72" y="201" class="section">FIELD / VERIFICATION LAYER</text>
  <rect x="72" y="220" width="280" height="68" rx="5" class="main"/>
  <text x="212" y="249" text-anchor="middle" class="head">CAPTURE</text><text x="212" y="271" text-anchor="middle" class="copy">Document + optional person input</text>
  <path d="M352 254 H404" class="flow"/>
  <rect x="414" y="220" width="280" height="68" rx="5" class="main"/>
  <text x="554" y="249" text-anchor="middle" class="head">EXTRACT</text><text x="554" y="271" text-anchor="middle" class="copy">OCR + classification + fields</text>
  <path d="M694 254 H746" class="flow"/>
  <rect x="756" y="220" width="280" height="68" rx="5" class="main"/>
  <text x="896" y="249" text-anchor="middle" class="head">VERIFICATION CASE</text><text x="896" y="271" text-anchor="middle" class="copy">One identity, one evidence record</text>
  <path d="M1036 254 H1088" class="flow"/>
  <rect x="1098" y="220" width="430" height="68" rx="5" class="node"/>
  <text x="1313" y="249" text-anchor="middle" class="head">VERIFICATION SIGNALS</text><text x="1313" y="271" text-anchor="middle" class="copy">Independent evidence enters the case</text>

  <rect x="72" y="330" width="1456" height="178" rx="6" class="signal"/>
  <text x="100" y="362" class="section">MULTI-SIGNAL TRUST</text>
  <line x1="100" y1="382" x2="1500" y2="382" class="rail"/>
  <line x1="452" y1="394" x2="452" y2="488" class="rail"/><line x1="804" y1="394" x2="804" y2="488" class="rail"/><line x1="1156" y1="394" x2="1156" y2="488" class="rail"/>
  <text x="130" y="421" class="head">DOCUMENT</text><text x="130" y="447" class="copy">OCR • Extraction</text><text x="130" y="469" class="copy">Structural validation</text><text x="130" y="491" class="copy">Document Integrity Analysis</text>
  <text x="482" y="421" class="head">PERSON</text><text x="482" y="447" class="copy">Optional face capture</text><text x="482" y="469" class="copy">Advisory Face Similarity</text><text x="482" y="491" class="copy">Officer-reviewed evidence</text>
  <text x="834" y="421" class="head">AUTHORITY</text><text x="834" y="447" class="copy">Authoritative Verification Gateway</text><text x="834" y="469" class="copy" fill="#f0ce84">NOT CONFIGURED</text><text x="834" y="491" class="copy">No government provider connected</text>
  <text x="1186" y="421" class="head">DEVICE / SECURITY</text><text x="1186" y="447" class="copy">ECDSA P-256 identity</text><text x="1186" y="469" class="copy">Signed requests • Nonce</text><text x="1186" y="491" class="copy">Replay protection</text>

  <path d="M800 508 V548" class="flow"/>
  <rect x="520" y="548" width="560" height="64" rx="5" class="main"/>
  <text x="800" y="576" text-anchor="middle" class="head">CONSISTENCY ENGINE</text><text x="800" y="598" text-anchor="middle" class="copy">Cross-signal comparison and evidence alignment</text>
  <path d="M800 612 V640" class="flow"/>
  <rect x="520" y="640" width="560" height="64" rx="5" class="main"/>
  <text x="800" y="668" text-anchor="middle" class="head">RISK INTELLIGENCE</text><text x="800" y="690" text-anchor="middle" class="copy">Advisory Risk Assessment • explainable contributions</text>
  <path d="M800 704 V732" class="flow"/>
  <rect x="520" y="732" width="560" height="64" rx="5" class="main"/>
  <text x="800" y="760" text-anchor="middle" class="head">EXPLAINABLE DECISION</text><text x="800" y="782" text-anchor="middle" class="copy">Clear • review • escalate • officer decides</text>

  <path d="M520 764 H344 V830" class="flow"/><path d="M1080 764 H1256 V830" class="flow"/>
  <rect x="72" y="830" width="544" height="50" rx="5" class="node"/><text x="344" y="861" text-anchor="middle" class="head">CASE RECORD / HQ OPERATIONS</text>
  <rect x="984" y="830" width="544" height="50" rx="5" class="audit"/><text x="1256" y="861" text-anchor="middle" class="head">TAMPER-EVIDENT AUDIT / SHA-256 HASH CHAIN</text>
</svg>
