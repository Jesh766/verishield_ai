<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <rect width="1600" height="1100" fill="#f4f6f5"/>
  <style>
    .title{font:700 38px Arial,sans-serif;fill:#182329}.sub{font:400 17px Arial,sans-serif;fill:#56656c}.h{font:700 18px Arial,sans-serif;fill:#182329}.b{font:400 14px Arial,sans-serif;fill:#3f5057}.t{font:700 11px Arial,sans-serif;letter-spacing:2px;fill:#087f6d}.box{fill:#fff;stroke:#aab9b8;stroke-width:2}.green{fill:#e5f5f0;stroke:#2c9f88;stroke-width:2}.amber{fill:#fff4df;stroke:#c38a2c;stroke-width:2}.blue{fill:#eaf1f7;stroke:#6388a5;stroke-width:2}.line{stroke:#318c7c;stroke-width:2.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#318c7c"/></marker></defs>
  <text x="70" y="70" class="title">VeriShield Technical Architecture</text><text x="70" y="101" class="sub">Audited prototype boundaries and integration points</text>
  <text x="70" y="150" class="t">CLIENT SIGNAL LAYER</text>
  <rect x="70" y="175" width="330" height="180" rx="4" class="green"/><text x="235" y="215" text-anchor="middle" class="h">Officer workstation</text><text x="95" y="250" class="b">React / TanStack Router</text><text x="95" y="276" class="b">Camera and file validation</text><text x="95" y="302" class="b">Local receipt ledger</text><text x="95" y="328" class="b">Network and sync tracker</text>
  <rect x="450" y="175" width="330" height="180" rx="4" class="green"/><text x="615" y="215" text-anchor="middle" class="h">Verification engine</text><text x="475" y="250" class="b">Tesseract.js OCR / classification</text><text x="475" y="276" class="b">Extraction and masking</text><text x="475" y="302" class="b">Checksum and MRZ rules</text><text x="475" y="328" class="b">ELA and advisory face similarity</text>
  <rect x="830" y="175" width="330" height="180" rx="4" class="amber"/><text x="995" y="215" text-anchor="middle" class="h">Decision support</text><text x="855" y="250" class="b">Weighted advisory risk score</text><text x="855" y="276" class="b">Explainable contributions</text><text x="855" y="302" class="b">Officer decision required</text><text x="855" y="328" class="b">No official risk claim</text>
  <rect x="1210" y="175" width="320" height="180" rx="4" class="blue"/><text x="1370" y="215" text-anchor="middle" class="h">WebCrypto identity</text><text x="1235" y="250" class="b">ECDSA P-256 key pair</text><text x="1235" y="276" class="b">Canonical signed payload</text><text x="1235" y="302" class="b">Nonce and timestamp</text><text x="1235" y="328" class="b">IndexedDB key storage</text>
  <path d="M400 265 H450" class="line"/><path d="M780 265 H830" class="line"/><path d="M1160 265 H1210" class="line"/>
  <text x="70" y="430" class="t">CONNECTED HQ SERVICE</text>
  <rect x="70" y="455" width="420" height="240" rx="4" class="blue"/><text x="280" y="495" text-anchor="middle" class="h">FastAPI gateway</text><text x="95" y="535" class="b">Payload limits / CORS / security headers</text><text x="95" y="563" class="b">Correlation IDs and privacy-safe logs</text><text x="95" y="591" class="b">Upload, OCR, extraction, validation APIs</text><text x="95" y="619" class="b">Signed sync and enrollment APIs</text><text x="95" y="647" class="b">Admin stats, cases, export, audit verify</text>
  <rect x="550" y="455" width="420" height="240" rx="4" class="amber"/><text x="760" y="495" text-anchor="middle" class="h">Authoritative gateway</text><text x="575" y="535" class="b">Provider adapter interface exists</text><text x="575" y="563" class="b">Current provider: local-only</text><text x="575" y="591" class="b">Status: NOT_CONFIGURED</text><text x="575" y="619" class="b">No UIDAI / Passport / Parivahan calls</text><text x="575" y="647" class="b">Integration requires authorization</text>
  <rect x="1030" y="455" width="500" height="240" rx="4" class="box"/><text x="1280" y="495" text-anchor="middle" class="h">Security and audit boundary</text><text x="1055" y="535" class="b">Registered device and officer authorization</text><text x="1055" y="563" class="b">In-memory nonce and rate-limit prototype state</text><text x="1055" y="591" class="b">Atomic session plus audit writes</text><text x="1055" y="619" class="b">SHA-256 hash chain, not blockchain</text><text x="1055" y="647" class="b">SQLite prototype ledger</text>
  <path d="M615 355 V410 H280 V455" class="line"/><path d="M995 355 V410 H760 V455" class="line"/><path d="M1370 355 V410 H1280 V455" class="line"/>
  <text x="70" y="780" class="t">OPERATIONAL SURFACES</text>
  <rect x="70" y="805" width="330" height="150" rx="4" class="green"/><text x="235" y="845" text-anchor="middle" class="h">Verify</text><text x="95" y="882" class="b">Capture, pipeline, decision, receipt</text><text x="95" y="910" class="b">Online-first story with local resilience</text>
  <rect x="450" y="805" width="330" height="150" rx="4" class="green"/><text x="615" y="845" text-anchor="middle" class="h">Cases</text><text x="475" y="882" class="b">Recorded evidence and reasons</text><text x="475" y="910" class="b">Officer review workflow</text>
  <rect x="830" y="805" width="330" height="150" rx="4" class="blue"/><text x="995" y="845" text-anchor="middle" class="h">Intelligence</text><text x="855" y="882" class="b">Observed rule-based signals</text><text x="855" y="910" class="b">Model/future AI clearly separated</text>
  <rect x="1210" y="805" width="320" height="150" rx="4" class="box"/><text x="1370" y="845" text-anchor="middle" class="h">Command center</text><text x="1235" y="882" class="b">HQ stats, analytics, devices</text><text x="1235" y="910" class="b">Audit chain and export</text>
</svg>
